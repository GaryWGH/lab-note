<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b8a">
<title>实验记录本</title>
<style>
/* Layout: phone-first notebook. Fixed bottom nav; single column of cards; tables scroll inside their own box. */
:root{
  --bg:#eef0f4; --paper:#fbfcfd; --ink:#18202c; --muted:#5d6777; --rule:#d6dbe3; --soft:#e5e9f0;
  --accent:#1f3b8a; --accent-soft:#e2e8f6; --ok:#2c7650; --ok-soft:#e0f1e7; --warn:#9a3b2e; --warn-soft:#f7e3df; --amber:#8a5a00; --amber-soft:#f8eed9;
  --f-body:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151d; --paper:#171f2b; --ink:#e3e8ef; --muted:#97a2b3; --rule:#2b3545; --soft:#202a39;
  --accent:#8fa9ee; --accent-soft:#1e2a46; --ok:#6cc396; --ok-soft:#183326; --warn:#ef9a8a; --warn-soft:#3a2220; --amber:#e3b25c; --amber-soft:#33291a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding:max(14px,env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.35rem;margin:0;line-height:1.3}
h2{font-size:1rem;margin:0 0 10px}
h3{font-size:.92rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.82rem} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
select,input,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--bg);border:1px solid var(--rule);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button,.btn{cursor:pointer;border-radius:7px;padding:7px 12px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);font-weight:500;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
button.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
button.sm{padding:3px 9px;font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
.f.full{grid-column:1/-1}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.76rem}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:99px;padding:3px 11px;font-size:.84rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.pill{display:inline-block;padding:0 8px;border-radius:99px;font-size:.76rem;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:block;padding:10px 0;border-top:1px solid var(--rule);color:var(--ink)}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.item .meta{font-size:.8rem;color:var(--muted)}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:9px 12px;font-size:.86rem}
.note{background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:.85rem}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:26px 1fr;gap:3px 10px;padding:10px 0;border-top:1px solid var(--rule)}
.step:first-child{border-top:0}
.step input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok)}
.step .tt{font-weight:500}
.step.done .tt{color:var(--muted);text-decoration:line-through}
.step .d,.step .fs{grid-column:2}
.step .d{font-size:.82rem;color:var(--muted)}
.step .fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:4px}
.calc{font-family:var(--f-mono);color:var(--accent);font-size:.9rem}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:88px;height:88px;object-fit:cover;border-radius:7px;border:1px solid var(--rule);background:var(--soft)}
.photos .ph{width:88px;height:88px;border-radius:7px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
.rgrid input{min-width:62px;padding:4px 6px;text-align:right;font-family:var(--f-mono)}
.rgrid td{padding:3px}
.rgrid tfoot td{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.bottom a{flex:1;text-align:center;padding:6px 2px;border-radius:8px;color:var(--muted);font-size:.86rem;font-weight:500}
nav.bottom a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.timer{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.timer:first-child{border-top:0}
.lam{font-family:var(--f-mono);font-size:.82rem}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bottom" id="nav">
  <a href="#/" data-nav="">今天</a>
  <a href="#/exps" data-nav="exps">实验</a>
  <a href="#/samples" data-nav="samples">样品</a>
  <a href="#/review" data-nav="review">回顾</a>
  <a href="#/more" data-nav="more">更多</a>
</nav>
<div class="viewer" id="viewer" hidden></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script>
(function(){
'use strict';
/* ================= constants ================= */
const LS_DB='labnote-db-v1', LS_META='labnote-meta-v1', LS_CFG='labnote-gh-v1';
const COLLS=['projects','experiments','samples','measurements','logs','reviews'];
const LOG_KINDS=['记录','想法','意外发现','问题','计时'];
const EXP_STATUS=['计划','进行中','等待结果','完成','放弃'];
const P_BUCKETS=[['0.95','95% 很有把握'],['0.9','90% 只怕意外'],['0.65','65% 能看到路径'],['0.3','30% 路径模糊']];
const FAIL_LAYERS=['材料','工艺','结构/设计','测量','环境','未知'];
const EVIDENCE=['已实测','部分实测','推断','文献'];
const SAMPLE_TYPES=['墨水/浆料','溶液','薄膜','打印线/电阻','器件','凝胶','其他'];
const SAMPLE_STATUS=['计划','制备中','可用','已用完','失败'];

/* process templates (v1: built in) */
const PT={
  none:{name:'不使用流程单',steps:[]},
  pilc:{name:'PILC 墨水制备（Oh 2024 流程）',steps:[
    {t:'称量 PEDOT:PSS 溶液',f:[['m_pedot','实际质量 (g)','num'],['lot_pedot','批号','text']]},
    {t:'加去离子水（PEDOT:PSS 质量的一半）',f:[['m_water','实际质量 (g)','num']]},
    {t:'加入添加剂',d:'按实验方案的目标量称量；吸湿试剂先干燥。',f:[['m_add','实际质量 (mg)','num'],['dissolve','溶解状态','sel:完全溶解|轻微浑浊|可见油滴']]},
    {t:'搅拌 900 rpm ≥ 12 h',f:[['pH','混合后 pH','num']]},
    {t:'液氮 10 min，冻干 72 h',d:'可在“今天”里加一个计时提醒。',f:[]},
    {t:'冻干物剪碎 + 10 mL 水，尖端超声 2 h（30%）',f:[['m_fd','冻干物用量 (mg)','num']]},
    {t:'加 Tween 80 30 mg，超声 3 min（20%）',f:[]},
    {t:'离心 45 min，倒上清',d:'记录 RCF，不要只记转速。',f:[['rcf','RCF (g)','num']]},
    {t:'补 10 mL 水、混匀、同条件再离心，取沉淀',f:[]}
  ]},
  fesoak:{name:'Fe³⁺ 浸泡交联（打印电阻）',steps:[
    {t:'同批打印并干燥',d:'所有组同一批墨水、同一针头和程序，打印后随机分组。',f:[['print','打印参数','text']]},
    {t:'测处理前阻值 R₀（记在“阻值稳定性”测量里）',f:[]},
    {t:'配 FeCl₃ 溶液并测 pH',d:'不要调 pH：高于约 2–3 会生成氢氧化铁沉淀。现配现用。',f:[['conc','浓度 (mM)','num'],['m_salt','称量 (mg)','num'],['pH','实测 pH','num']]},
    {t:'浸泡',f:[['t_soak','时间 (min)','num']]},
    {t:'去离子水漂洗 3 × 30 s，干燥',f:[['dry','干燥条件','text']]}
  ]},
  print:{name:'DIW 打印',steps:[
    {t:'墨水准备与脱泡',f:[['ink','墨水样品号','text']]},
    {t:'设置打印参数',f:[['nozzle','针头内径 (µm)','num'],['pressure','气压 (kPa)','num'],['speed','速度 (mm/s)','num'],['layers','层数','num']]},
    {t:'打印',f:[['substrate','基底','text']]},
    {t:'干燥 / 后处理',f:[['post','条件','text']]}
  ]}
};
/* measurement templates */
const MT={
  sep:{name:'离心分相评估',fields:[['sup','上清颜色','sel:无色|浅蓝|蓝|深蓝'],['m_fd','冻干物用量 (mg)','num'],['dry','沉淀干重 (mg)','num'],['ext','挤出表现','sel:可挤出且保形|可挤出但塌陷|难以挤出']],calcs:['yield']},
  fourpp:{name:'四探针电导',fields:[['thick','膜厚 (µm)','num'],['rs','方阻 (Ω/sq)','num']],calcs:['sigma']},
  rstab:{name:'阻值稳定性',fields:[['nrows','电阻线条数','num'],['unit','阻值单位','text'],['critD','验收 |ΔR| ≤ (%)','num'],['critCV','验收 CV ≤ (%)','num']],
    table:{cols:[['R0','R₀ 处理前'],['R1','R₁ 处理后'],['Rd','第 3–7 天'],['Rw','泡水 1 h'],['Rig','凝胶 24 h']]},calcs:['stab'],
    defaults:{nrows:'5',unit:'kΩ',critD:'5',critCV:'10'}},
  oect:{name:'OECT 转移特性',fields:[['W','沟道宽 W (µm)','num'],['L','沟道长 L (µm)','num'],['d','沟道厚 d (nm)','num'],['electrolyte','电解质','text'],['gate','栅极','text'],['VD','V_D (V)','num'],['VG','V_G 扫描范围','text'],['gm','g_m 最大 (mS)','num'],['VGgm','g_m 最大处 V_G (V)','num'],['Vth','V_th (V)','num'],['onoff','开关比','text'],['tau','响应时间 τ (ms)','num'],['raw','原始数据文件','text']],calcs:['muc']},
  rheo:{name:'流变',fields:[['ty','屈服应力 (Pa)','num'],['Gp','储能模量 G′ (Pa)','num'],['eta','黏度 @0.1 s⁻¹ (Pa·s)','num'],['geo','测试条件','text']]},
  generic:{name:'通用测量',fields:[['what','测量项目','text'],['value','数值','num'],['unit','单位','text'],['method','方法 / 仪器','text']]}
};
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:null;};
const CALC={
  yield:v=>{const d=num(v.dry),m=num(v.m_fd);return {label:'沉淀收率',text:d!=null&&m?fmt(d/m*100,1)+' %':'—'};},
  sigma:v=>{const t=num(v.thick),r=num(v.rs);return {label:'电导率 σ',text:t&&r?fmt(1/(r*t*1e-4),1)+' S/cm':'—'};},
  muc:v=>{const gm=num(v.gm),L=num(v.L),W=num(v.W),d=num(v.d),vt=num(v.Vth),vg=num(v.VGgm);
    if(gm==null||!L||!W||!d||vt==null||vg==null||vt===vg)return {label:'μC* 单点估算',text:'—'};
    const x=(gm*1e-3)*(L*1e-4)/((W*1e-4)*(d*1e-7)*Math.abs(vt-vg));return {label:'μC* 单点估算',text:fmt(x,1)+' F cm⁻¹ V⁻¹ s⁻¹',note:'正式数值应按 Inal 2017 对多组 W·d/L 线性拟合。'};}
};

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(x,d){return (x==null||!isFinite(x))?'—':x.toFixed(d);}
function sgn(x,d){return (x==null||!isFinite(x))?'—':(x>0?'+':'')+x.toFixed(d)+' %';}
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ymd6(){const d=new Date();return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate());}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k];});a[ks[ks.length-1]]=v;}
function shortDate(iso){if(!iso)return '';const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}

/* ================= store ================= */
let db, meta, cfg;
function emptyDb(){const o={version:1};COLLS.forEach(c=>o[c]={});return o;}
function load(){
  try{db=JSON.parse(localStorage.getItem(LS_DB));}catch(e){db=null;}
  try{meta=JSON.parse(localStorage.getItem(LS_META))||{};}catch(e){meta={};}
  try{cfg=JSON.parse(localStorage.getItem(LS_CFG))||{};}catch(e){cfg={};}
  if(!db){db=emptyDb();seed();meta.dirty=true;}
  COLLS.forEach(c=>{if(!db[c])db[c]={};});
}
function saveLocal(){try{localStorage.setItem(LS_DB,JSON.stringify(db));localStorage.setItem(LS_META,JSON.stringify(meta));}catch(e){setSync('本机保存失败：存储空间不足或被禁用','err');}}
function live(c){return Object.values(db[c]).filter(r=>!r.deleted);}
function get(c,id){const r=db[c][id];return r&&!r.deleted?r:null;}
function put(c,r){r.updatedAt=now();if(!r.createdAt)r.createdAt=r.updatedAt;db[c][r.id]=r;changed();return r;}
function touch(c,id){const r=db[c][id];if(r){r.updatedAt=now();changed();}}
function remove(c,id){const r=db[c][id];if(r){r.deleted=true;r.updatedAt=now();changed();}}
function nextId(c,prefix,daily,w){const base=daily?prefix+'-'+ymd6()+'-':prefix+'-';let n=0;Object.keys(db[c]).forEach(k=>{if(k.startsWith(base)){const x=parseInt(k.slice(base.length),10);if(x>n)n=x;}});return base+String(n+1).padStart(w||2,'0');}

/* ================= seed (first run only) ================= */
function seed(){
  const t=now(), mk=(c,r)=>{r.createdAt=r.updatedAt=t;db[c][r.id]=r;};
  const P=[
    ['PJ-01','PEDOT:PSS 可打印墨水（PILC）','得到可 DIW 打印、高电导、无需后处理的 PEDOT 墨水，用于 OECT 沟道和电极。'],
    ['PJ-02','CNT 电阻墨水','打印出阻值可预测、可重复、耐汗液/离子凝胶的电阻，作为电导权重单元。'],
    ['PJ-03','纳米银墨水','互连、电极与栅极基底。'],
    ['PJ-04','离子凝胶电解质','EMIM:ES + AA/AAm，解决渗液，局部薄层电解质。'],
    ['PJ-05','OECT 器件与物理计算','统一的转移曲线、g_m、频率响应、τ，以及制造参数到功能的映射。']
  ];
  P.forEach(([id,name,goal])=>mk('projects',{id,name,goal,status:'进行中',next:'',outline:{intro:'',figs:[],conclusion:''}}));
  db.projects['PJ-01'].outline.figs=[{id:'F1',title:'墨水制备与分相机理',claim:'离子液体 / 盐的阴阳离子性质决定 PEDOT:PSS 能否离心分相',status:'空'},{id:'F2',title:'流变与可打印性',claim:'',status:'空'}];
  db.projects['PJ-02'].outline.figs=[{id:'F1',title:'几何—阻值标定与一致性',claim:'',status:'空'},{id:'F2',title:'交联后耐水 / 耐凝胶稳定性',claim:'Fe³⁺ 后浸泡使阻值在泡水和贴凝胶后保持稳定',status:'空'}];
  mk('experiments',{id:'E-001',projectId:'PJ-01',figId:'F1',title:'LiTFSI 诱导 PEDOT:PSS 离心分相',
    question:'硬阳离子 + 疏水软阴离子的盐能否替代 EMIM:TCB 实现分相？',
    hypothesis:'Li⁺ 亲水、与 PSS⁻ 结合，TFSI⁻ 疏水、去掺杂 PEDOT 外壳，使 PEDOT 胶体压实沉降。',
    plan:'LiTFSI 1.5 当量（20 g PEDOT:PSS 加 381 mg）。若上清仍蓝，再做 3 当量（762 mg）。EMIM:TCB 买得到则作参照（300 mg）。',
    criteria:'上清液接近无色；沉淀可挤出且保形。电导率为加分项。',
    p:'0.65',handsOn:'6',days:'6',status:'计划',result:'',evidence:'',failLayer:'',failWhy:'',actualDays:''});
  mk('experiments',{id:'E-002',projectId:'PJ-02',figId:'F2',title:'CNT/CMC 电阻 Fe³⁺ 后浸泡交联',
    question:'Fe³⁺ 后浸泡能否让打印电阻在泡水和贴离子凝胶后阻值稳定？',
    hypothesis:'Fe³⁺ 与 CMC / CNT-COOH 羧酸根配位交联，抑制溶胀；但离子强度高时配位会减弱（Baretta 2024）。',
    plan:'FeCl₃ 10 mM 与 100 mM 各 5 条，另 2 条不处理作参考。两档都达标时选 10 mM。',
    criteria:'R₁ 的 CV ≤ 10%；第 3–7 天、泡水 1 h、凝胶 24 h 相对 R₁ 的单条 |ΔR| ≤ 5%。',
    p:'0.65',handsOn:'4',days:'8',status:'计划',result:'',evidence:'',failLayer:'',failWhy:'',actualDays:''});
}

/* ================= GitHub sync ================= */
let syncTimer=null, syncing=false, syncMsg={t:'',cls:''};
function ghReady(){return cfg.owner&&cfg.repo&&cfg.token;}
function ghUrl(p){return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+p;}
function ghHead(accept){return {'Authorization':'Bearer '+cfg.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
function b64utf8(s){const b=new TextEncoder().encode(s);let out='';for(let i=0;i<b.length;i+=0x8000)out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(out);}
async function ghGetText(path){
  const br=cfg.branch||'main';
  const r=await fetch(ghUrl(path)+'?ref='+encodeURIComponent(br),{headers:ghHead()});
  if(r.status===404||r.status===409)return {sha:null,text:null};
  if(!r.ok)throw new Error('读取失败 '+r.status);
  const j=await r.json();
  const r2=await fetch(ghUrl(path)+'?ref='+encodeURIComponent(br),{headers:ghHead('application/vnd.github.raw+json')});
  if(!r2.ok)throw new Error('读取失败 '+r2.status);
  return {sha:j.sha,text:await r2.text()};
}
async function ghPut(path,b64,sha,message){
  const body={message,content:b64,branch:cfg.branch||'main'};if(sha)body.sha=sha;
  const r=await fetch(ghUrl(path),{method:'PUT',headers:{...ghHead(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return {conflict:true};
  if(!r.ok)throw new Error('写入失败 '+r.status+(r.status===401||r.status===403?'（检查令牌权限）':''));
  const j=await r.json();return {sha:j.content.sha};
}
function merge(a,b){const out={version:1};COLLS.forEach(c=>{const x=a[c]||{},y=b[c]||{};out[c]={};new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{const p=x[k],q=y[k];out[c][k]=!p?q:!q?p:((q.updatedAt||'')>(p.updatedAt||'')?q:p);});});return out;}
function changed(){meta.dirty=true;saveLocal();clearTimeout(syncTimer);if(ghReady())syncTimer=setTimeout(sync,2500);setSync(ghReady()?'待同步…':'仅本机（未连接 GitHub）',ghReady()?'':'warn');}
async function sync(manual){
  if(!ghReady()){setSync('仅本机（未连接 GitHub）','warn');return;}
  if(syncing){clearTimeout(syncTimer);syncTimer=setTimeout(sync,2000);return;}
  syncing=true;setSync('同步中…','');
  try{
    for(let attempt=0;attempt<3;attempt++){
      const remote=await ghGetText('db.json');
      let rdb=null;if(remote.text){try{rdb=JSON.parse(remote.text);}catch(e){throw new Error('仓库中的 db.json 无法解析');}}
      const merged=rdb?merge(db,rdb):db;
      const mergedStr=JSON.stringify(merged);
      const changedLocal=JSON.stringify(db)!==mergedStr;
      db=merged;
      if(!rdb||JSON.stringify(rdb)!==mergedStr){
        const res=await ghPut('db.json',b64utf8(JSON.stringify(merged,null,1)),remote.sha,'notebook update '+new Date().toLocaleString('zh-CN'));
        if(res.conflict)continue;
        meta.sha=res.sha;
      }else meta.sha=remote.sha;
      meta.dirty=false;meta.lastSync=now();saveLocal();
      await flushPhotos();
      setSync('已同步 '+shortDate(meta.lastSync),'ok');
      if(changedLocal&&!document.activeElement?.closest?.('#app'))render();
      syncing=false;return;
    }
    throw new Error('多次写入冲突，请稍后再试');
  }catch(e){setSync(String(e.message||e)+(navigator.onLine?'':'（离线，联网后自动重试）'),'err');}
  syncing=false;
}
function inline(t,cls){const el=$('#syncInline');if(el){el.textContent=t;el.style.color=cls==='ok'?'var(--ok)':cls==='err'?'var(--warn)':'var(--muted)';}}
async function connectAndSync(btn){
  ['owner','repo','branch','token'].forEach(k=>{const el=$('#g_'+k);if(el)cfg[k]=el.value.trim();});
  if(!cfg.branch)cfg.branch='main';
  try{localStorage.setItem(LS_CFG,JSON.stringify(cfg));}catch(e){}
  const miss=[['owner','GitHub 用户名'],['repo','数据仓库名'],['token','访问令牌']].filter(([k])=>!cfg[k]).map(x=>x[1]);
  if(miss.length){inline('请先填写：'+miss.join('、')+'。输入框里的灰色字只是提示，不是已填的内容。','err');return;}
  btn.disabled=true;inline('正在检查仓库和令牌…','');
  try{
    const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo),{headers:ghHead()});
    if(r.status===401)throw new Error('令牌无效或已过期，请重新生成并完整粘贴。');
    if(r.status===404)throw new Error('找不到仓库 '+cfg.owner+'/'+cfg.repo+'。请检查用户名和仓库名的拼写，并确认生成令牌时在 Repository access 里勾选了这个仓库。');
    if(r.status===403)throw new Error('GitHub 拒绝访问（403），可能是令牌权限不足或请求过于频繁，稍后再试。');
    if(!r.ok)throw new Error('检查仓库失败（'+r.status+'）');
    const info=await r.json();
    if(info.permissions&&!info.permissions.push)throw new Error('令牌只有读取权限。请把令牌的 Contents 权限改成 Read and write。');
    inline(info.private?'仓库连接正常，正在同步…':'注意：这个仓库是公开的，数据会被所有人看到，建议改为 Private。正在同步…',info.private?'':'err');
    await sync(true);
    if(syncMsg.cls==='err')inline('同步失败：'+syncMsg.t,'err');
    else inline((info.private?'':'（仓库是公开的）')+'同步完成。之后的修改会自动同步。','ok');
  }catch(e){inline(e.message==='Failed to fetch'?'无法连接 GitHub，请检查网络。':e.message,'err');}
  btn.disabled=false;
}
function setSync(t,cls){syncMsg={t,cls};const el=$('#syncStatus');if(el){el.textContent=t;el.className='pill '+(cls==='ok'?'ok':cls==='err'?'warn':cls==='warn'?'amber':'');}}

let idb=null;
function openIdb(){return new Promise(res=>{if(idb)return res(idb);try{const rq=indexedDB.open('labnote-photos',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('pending',{keyPath:'path'});rq.onsuccess=()=>{idb=rq.result;res(idb);};rq.onerror=()=>res(null);}catch(e){res(null);}});}
async function idbOp(mode,fn){const d=await openIdb();if(!d)return null;return new Promise(res=>{const tx=d.transaction('pending',mode);const st=tx.objectStore('pending');const rq=fn(st);tx.oncomplete=()=>res(rq?rq.result:null);tx.onerror=()=>res(null);});}
const photoCache={};
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82));};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('无法读取图片'));};img.src=u;});}
let photoTarget=null;
$('#photoInput').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f||!photoTarget)return;
  const {c,id}=photoTarget;const r=db[c][id];if(!r)return;
  try{
    const dataUrl=await compress(f);const path='photos/'+id+'/'+Date.now()+'.jpg';
    photoCache[path]=dataUrl;
    await idbOp('readwrite',st=>st.put({path,b64:dataUrl.split(',')[1]}));
    r.photos=r.photos||[];r.photos.push(path);touch(c,id);render();
    if(ghReady())flushPhotos();
  }catch(e){alertBar('照片处理失败：'+e.message);}
});
async function flushPhotos(){
  if(!ghReady())return;const all=await idbOp('readonly',st=>st.getAll());if(!all)return;
  for(const p of all){try{await ghPut(p.path,p.b64,null,'photo '+p.path);await idbOp('readwrite',st=>st.delete(p.path));}catch(e){break;}}
}
async function photoSrc(path){
  if(photoCache[path])return photoCache[path];
  const pend=await idbOp('readonly',st=>st.get(path));
  if(pend){photoCache[path]='data:image/jpeg;base64,'+pend.b64;return photoCache[path];}
  if(!ghReady())return null;
  try{const r=await fetch(ghUrl(path)+'?ref='+encodeURIComponent(cfg.branch||'main'),{headers:ghHead('application/vnd.github.raw+json')});if(!r.ok)return null;const u=URL.createObjectURL(await r.blob());photoCache[path]=u;return u;}catch(e){return null;}
}
function hydratePhotos(){document.querySelectorAll('img[data-photo]').forEach(async img=>{const s=await photoSrc(img.dataset.photo);if(s)img.src=s;else img.alt='未加载';});}

function stabStats(m){
  const v=m.vals||{},t=m.table||{},n=Math.min(Math.max(Math.round(num(v.nrows)||5),1),24);
  const st={};MT.rstab.table.cols.forEach(([c])=>{const base=c==='R0'?null:c==='R1'?'R0':'R1';const xs=[],rel=[];for(let i=1;i<=n;i++){const x=num(t[c+'_'+i]);if(x==null)continue;xs.push(x);if(base){const b=num(t[base+'_'+i]);if(b)rel.push((x-b)/b*100);}}
    if(!xs.length){st[c]={};return;}const mn=xs.reduce((a,b)=>a+b,0)/xs.length,sd=xs.length>1?Math.sqrt(xs.reduce((a,b)=>a+(b-mn)**2,0)/(xs.length-1)):null;
    st[c]={n:xs.length,mean:mn,cv:sd!=null&&mn?sd/mn*100:null,d:rel.length?rel.reduce((a,b)=>a+b,0)/rel.length:null,max:rel.length?Math.max(...rel.map(Math.abs)):null};});
  const cd=num(v.critD)??5,cc=num(v.critCV)??10;let verdict='数据未齐';
  if(st.R1.cv!=null&&['Rd','Rw','Rig'].every(k=>st[k].max!=null))verdict=(st.R1.cv<=cc&&['Rd','Rw','Rig'].every(k=>st[k].max<=cd))?'达标':'不达标';
  return {n,st,verdict,cd,cc};
}
function expSummary(S){
  const ids=new Set(S.map(s=>s.id));const M=live('measurements').filter(m=>ids.has(m.sampleId));
  if(!M.length)return '';

function gridBox(m){
  const {n,st}=stabStats(m);const cols=MT.rstab.table.cols;const t=m.table||{};

  return h+'</tbody><tfoot id="r_gridfoot">'+gridFoot(m)+'</tfoot></table></div><p class="muted small">ΔR₁ 相对 R₀（掺杂效应）；后三列相对 R₁（稳定性）。</p>';

function gridFoot(m){const {st}=stabStats(m);const cols=MT.rstab.table.cols;

function calcBox(m,T){
  if(m.template==='rstab'){const {verdict,cd,cc}=stabStats(m);return `<h2>判定</h2><span class="pill ${verdict==='达标'?'ok':verdict==='不达标'?'warn':''}">${verdict}</span><div class="muted small" style="margin-top:6px">标准：R₁ 的 CV ≤ ${cc}%，且第 3–7 天、泡水、凝胶三列的单条 |ΔR| ≤ ${cd}%。</div>`;}

}

  let h=head('搜索','');
  h+=`<input id="q" placeholder="关键词，如 LiTFSI、批号、开裂" value="${esc(window.__q||'')}">`;
  h+=`<section class="card">${q?(res.length?`<div class="list">${res.map(([k,href,t])=>`<a class="item" href="${href}"><span class="pill">${k}</span> ${esc(t)}</a>`).join('')}</div>`:'<div class="muted small">没有结果。</div>'):'<div class="muted small">输入关键词。</div>'}</section>`;
  return h;
}
function vSettings(){
  let h=head('设置与同步');
  h+=`<section class="card"><h2>GitHub 私有仓库</h2><div class="grid">
    <label class="f" for="g_owner">GitHub 用户名<input id="g_owner" data-cfg="owner" value="${esc(cfg.owner||'')}" placeholder="（必填）" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="f" for="g_repo">数据仓库名<input id="g_repo" data-cfg="repo" value="${esc(cfg.repo||'')}" placeholder="（必填）" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="f" for="g_branch">分支<input id="g_branch" data-cfg="branch" value="${esc(cfg.branch||'main')}" autocapitalize="off"></label>
    <label class="f full" for="g_token">访问令牌（只授权这一个仓库的 Contents 读写）<input id="g_token" type="password" data-cfg="token" value="${esc(cfg.token||'')}" autocomplete="off" placeholder="（必填）github_pat_ 开头"></label>
  </div><div class="row" style="margin-top:10px"><button data-act="syncNow">保存并同步</button><span class="muted small">${meta.lastSync?'上次同步 '+shortDate(meta.lastSync):'尚未同步'}</span></div>
  <div id="syncInline" class="small" style="margin-top:8px" aria-live="polite"></div>
  <div class="note" style="margin-top:12px">
   <b>第一次设置</b><br>
   1. 在 GitHub 新建一个 <b>Private</b> 仓库（例如 lab-data），勾选 “Add a README”。<br>
   2. 头像 → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token。Repository access 选 “Only select repositories” 并只选 lab-data；Permissions 里把 <b>Contents</b> 设为 Read and write，其余不动。<br>
   3. 把令牌粘贴到上面，点“保存并同步”。在每台设备上各做一次第 3 步即可。<br>
   令牌只保存在这台设备的浏览器里，只会发给 api.github.com。手机丢失时到 GitHub 删除这个令牌即可。
  </div></section>`;
  h+=`<section class="card"><h2>备份</h2><div class="row"><button class="ghost" data-act="export">导出全部数据 (JSON)</button><label class="btn ghost" for="impFile">导入并合并</label><input type="file" id="impFile" accept=".json,application/json" hidden></div><p class="muted small">导入会与现有数据合并，同一条记录保留较新的版本。照片不包含在 JSON 里，它们在 GitHub 仓库的 photos 文件夹中。</p></section>`;
  h+=`<section class="card"><h2>框架来源</h2><div class="small">论文提纲组织研究：Whitesides · 每日日志与双周回顾：John Schulman · 按失败率排序、记录预估与实际：Jacob Steinhardt · 可行性×兴趣与“云”中的意外发现：Uri Alon · 对时间诚实：Michael Nielsen · 样品—工艺—测量的数据模型：NOMAD ELN。</div></section>`;
  return h;
}
function notFound(){return head('找不到记录')+'<section class="card"><a href="#/">回到今天</a></section>';}

/* ================= router ================= */
function route(){const h=location.hash.replace(/^#\/?/,'');const [a,b]=h.split('/');return {a:a||'',b:b?decodeURIComponent(b):''};}
function render(){
  regions={};const {a,b}=route();let html;
  switch(a){case '':html=vToday();break;case 'exps':html=vExps();break;case 'exp':html=vExp(b);break;case 'samples':html=vSamples();break;case 'sample':html=vSample(b);break;case 'meas':html=vMeas(b);break;case 'review':html=vReview();break;case 'more':html=vMore();break;case 'projects':html=vProjects();break;case 'project':html=vProject(b);break;case 'ideas':html=vIdeas();break;case 'search':html=vSearch();break;case 'settings':html=vSettings();break;default:html=notFound();}
  $('#app').innerHTML=html;
  const navKey={'':'',exps:'exps',exp:'exps',samples:'samples',sample:'samples',meas:'samples',review:'review'}[a];
  document.querySelectorAll('#nav a').forEach(x=>x.setAttribute('aria-current',x.dataset.nav===(navKey===undefined?'more':navKey)?'page':'false'));
  setSync(syncMsg.t||(ghReady()?'':'仅本机（未连接 GitHub）'),syncMsg.cls||(ghReady()?'':'warn'));
  hydratePhotos();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

/* ================= events ================= */
function alertBar(t){setSync(t,'err');}
const app=$('#app');
app.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.b&&!t.dataset.bool){const [c,id,path]=t.dataset.b.split('|');const r=db[c][id];if(!r)return;setPath(r,path,t.value);touch(c,id);
    const rr=t.dataset.r;if(rr==='gridfoot'){const tf=$('#r_gridfoot');if(tf)tf.innerHTML=gridFoot(r);const cb=$('#r_calc');if(cb&&regions.calc)cb.innerHTML=regions.calc();}
    else if(rr&&regions[rr]){const el=$('#r_'+rr);if(el)el.innerHTML=regions[rr]();if(rr==='grid'){const cb=$('#r_calc');if(cb&&regions.calc)cb.innerHTML=regions.calc();}}
    return;}
  if(t.dataset.draft){window.__draft[t.dataset.draft]=t.value;return;}
  if(t.dataset.cfg){cfg[t.dataset.cfg]=t.value.trim();try{localStorage.setItem(LS_CFG,JSON.stringify(cfg));}catch(e){}return;}
  if(t.id==='sq'){window.__sq=t.value;const pos=t.selectionStart;render();const n=$('#sq');n.focus();n.setSelectionRange(pos,pos);return;}
  if(t.id==='q'){window.__q=t.value;const pos=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);return;}
});
app.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.b&&t.dataset.bool){const [c,id,path]=t.dataset.b.split('|');const r=db[c][id];setPath(r,path,t.checked);touch(c,id);t.closest('.step')?.classList.toggle('done',t.checked);return;}
  if(t.dataset.b&&t.tagName==='SELECT'){const [c]=t.dataset.b.split('|');if(['projectId','experimentId'].some(k=>t.dataset.b.endsWith(k)))render();return;}
  if(t.dataset.draft&&t.tagName==='SELECT'){window.__draft[t.dataset.draft]=t.value;return;}
  if(t.dataset.rv){window['__rv'+(t.dataset.rv==='start'?'Start':'End')]=t.value;render();return;}
  if(t.dataset.act==='procTpl'){const s=db.samples[t.dataset.id];s.proc=s.proc||{done:{},vals:{},dev:''};s.proc.template=t.value;s.proc.done={};touch('samples',s.id);render();return;}
  if(t.id==='impFile'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const d=o.data||o;if(!d.samples&&!d.logs)throw 0;db=merge(db,d);changed();render();setSync('已导入并合并','ok');}catch(e){setSync('导入失败：不是本记录本导出的文件','err');}t.value='';};rd.readAsText(f);}
});
app.addEventListener('click',ev=>{
  const v=ev.target.closest('[data-view]');if(v&&v.src){const vw=$('#viewer');vw.innerHTML=`<img src="${v.src}" alt="照片">`;vw.hidden=false;return;}
  const k=ev.target.closest('[data-kind]');if(k){window.__draft.kind=k.dataset.kind;render();return;}
  const ef=ev.target.closest('[data-expfil]');if(ef){window.__expFil=ef.dataset.expfil;render();return;}
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const act=b.dataset.act;
  if(act==='addLog'){const d=window.__draft;if(!d.text.trim()&&d.kind!=='计时'){setSync('先写点内容','warn');return;}
    if(d.kind==='计时'&&!d.due){setSync('计时需要填写到期时间','warn');return;}
    const id='L-'+Date.now().toString(36);put('logs',{id,date:today(),kind:d.kind,text:d.text.trim(),projectId:d.projectId,experimentId:d.experimentId,hours:d.kind==='计时'?'':d.hours,rh:d.rh,temp:d.temp,due:d.due,photos:[]});
    window.__draft={kind:d.kind,text:'',projectId:d.projectId,experimentId:d.experimentId,hours:'',rh:d.rh,temp:d.temp,due:''};render();return;}
  if(act==='timerDone'){const l=db.logs[b.dataset.id];l.done=true;touch('logs',l.id);render();return;}
  if(act==='delLog'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='确认删除';return;}remove('logs',b.dataset.id);render();return;}
  if(act==='del'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='再点一次确认';return;}remove(b.dataset.c,b.dataset.id);history.back();return;}
  if(act==='photo'){photoTarget={c:b.dataset.c,id:b.dataset.id};$('#photoInput').click();return;}
  if(act==='newExp'){const id=nextId('experiments','E',false,3);put('experiments',{id,projectId:b.dataset.proj||'',title:'新实验',status:'计划',p:'',days:'',handsOn:''});location.hash='#/exp/'+id;return;}
  if(act==='newSample'||act==='derive'){const id=nextId('samples','S',true,2);const src=act==='derive'?db.samples[b.dataset.id]:null;put('samples',{id,name:src?(src.name||'')+' 派生':'',type:'',status:'计划',experimentId:b.dataset.exp||src?.experimentId||'',date:today(),parentIds:src?src.id:'',recipe:'',lots:'',notes:'',photos:[],proc:{template:'none',done:{},vals:{},dev:''}});location.hash='#/sample/'+id;return;}
  if(act==='newMeas'){const tk=$('#newMeasT').value;const id=nextId('measurements','M',true,2);put('measurements',{id,sampleId:b.dataset.id,template:tk,date:today(),vals:{...(MT[tk].defaults||{})},table:{},notes:'',photos:[]});location.hash='#/meas/'+id;return;}
  if(act==='newProject'){const id=nextId('projects','PJ',false,2);put('projects',{id,name:'新项目',status:'进行中',goal:'',next:'',outline:{intro:'',figs:[],conclusion:''}});location.hash='#/project/'+id;return;}
  if(act==='addFig'){const p=db.projects[b.dataset.id];p.outline=p.outline||{figs:[]};p.outline.figs=p.outline.figs||[];p.outline.figs.push({id:'F'+(p.outline.figs.length+1),title:'',claim:'',status:'空'});touch('projects',p.id);render();return;}
  if(act==='ideaToExp'){const l=db.logs[b.dataset.id];const id=nextId('experiments','E',false,3);put('experiments',{id,projectId:l.projectId||'',title:l.text.split('\n')[0].slice(0,40),question:l.text,status:'计划',p:'',days:'',handsOn:''});l.ideaStatus='已转实验';l.toExp=id;touch('logs',l.id);location.hash='#/exp/'+id;return;}
  if(act==='ideaDrop'){const l=db.logs[b.dataset.id];l.ideaStatus='放弃';touch('logs',l.id);render();return;}
  if(act==='newReview'){const id='RV-'+b.dataset.end;put('reviews',{id,start:b.dataset.start,end:b.dataset.end,findings:'',insights:'',progress:'',next:'',followed:''});render();return;}
  if(act==='syncNow'){connectAndSync(b);return;}
  if(act==='export'){const blob=new Blob([JSON.stringify({app:'labnote',exported:now(),data:db},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='labnote-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);return;}
});
$('#viewer').addEventListener('click',()=>{$('#viewer').hidden=true;});

/* ================= boot ================= */
load();saveLocal();render();
if(ghReady())sync();
setInterval(()=>{if(route().a===''&&!app.contains(document.activeElement))render();},60000);
window.__labnote={get db(){return db;},merge,stabStats,CALC,lam,render};
})();
</script>
